<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Contact</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>

  <body class="bg-secondary">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <ul class="navbar-nav mx-auto gap-5">
            <li class="nav-item me-5 fs-4">
              <a class="nav-link active" href="index.html"><b>Home</b></a>
            </li>
            <li class="nav-item me-5 fs-4">
              <a class="nav-link active" href="products.html"><b>Products</b></a>
            </li>
            <li class="nav-item me-5 fs-4">
              <a class="nav-link active" href="about.html"><b>About Us</b></a>
            </li>
            <li class="nav-item fs-4">
              <a class="nav-link active" href="contact.html"><b>Contact Us</b></a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <div class="animate__animated animate__fadeIn alert alert-info alert-dismissible fade  show m-3" role="alert" >
      <strong>Get in Touch!</strong> Fill in the form below and we will get back to you as soon as possible.
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <section class="animate__animated animate__fadeIn">
      <div>
        <form
          method="post"
          action="https://formspree.io/f/xqenqyyz"
          class="d-flex gap-3 flex-column align-items-center justify-content-center p-3 bg-secondary w-100"
        >
          <div
            class="form-control d-flex gap-3 flex-column align-items-center justify-content-center bg-dark text-white w-25"
          >
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required /><br /><br />
            <label for="surname">Surname</label>
            <input type="text" id="surname" name="surname" required /><br /><br />
            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="jacobdoe@gmail.com"
              required
            />
            <label for="number">Number:</label>
            <input type="tel" id="number" name="number" required />
          </div>
          <div
            class="form-control d-flex gap-3 flex-column align-items-center justify-content-center bg-dark text-white w-25"
          >
            <label for="subject">Subject:</label>
            <select id="subject" name="subject" required>
              <option value="" disabled selected>Select a subject</option>
              <option value="sales">Sales</option>
              <option value="support">Technical Support</option>
              <option value="billing">Billing</option>
              <option value="feedback">Feedback</option>
              <option value="general_feedback">General Inquiry</option>
              <option value="service">Customer Service</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div
            class="form-control d-flex gap-3 flex-column align-items-center justify-content-center bg-dark text-white w-25"
          >
            <label for="message">Message</label>
            <textarea cols="30" rows="10" name="message" id="message"></textarea>
          </div>
          <button id="submit_button" type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
